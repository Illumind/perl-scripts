name: NFC Purchase Tracker APK

on:
  push:
    paths:
      - "nfc-purchase-tracker/**"
      - ".github/workflows/nfc-purchase-tracker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfc-purchase-tracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: moi-pokupky-apk
          path: nfc-purchase-tracker/app/build/outputs/apk/release/*.apk
